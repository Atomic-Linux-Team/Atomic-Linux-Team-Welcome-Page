<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a nuestra Organización</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(30px);
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            max-width: 600px;
        }
        .cta-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #238636;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            transform: scale(0.8);
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: #2ea043;
        }
        .bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(56, 139, 253, 0.1);
            filter: blur(40px);
        }
    </style>
</head>
<body>
    <div class="bg-elements" id="bg"></div>
    <div class="container">
        <h1 id="title">Bienvenido a nuestra Organización</h1>
        <p id="subtitle">Innovando el futuro a través del código abierto y la colaboración en GitHub.</p>
        <a href="https://github.com" class="cta-button" id="cta">Explorar Repositorios</a>
    </div>

    <script>
        // Crear elementos de fondo animados
        const bg = document.getElementById('bg');
        for (let i = 0; i < 10; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            const size = Math.random() * 300 + 100;
            circle.style.width = `${size}px`;
            circle.style.height = `${size}px`;
            circle.style.left = `${Math.random() * 100}%`;
            circle.style.top = `${Math.random() * 100}%`;
            bg.appendChild(circle);
        }

        // Animaciones de entrada con Anime.js
        anime({
            targets: '#title',
            opacity: [0, 1],
            translateY: [30, 0],
            duration: 1000,
            easing: 'easeOutExpo'
        });

        anime({
            targets: '#subtitle',
            opacity: [0, 1],
            translateY: [30, 0],
            duration: 1000,
            delay: 300,
            easing: 'easeOutExpo'
        });

        anime({
            targets: '#cta',
            opacity: [0, 1],
            scale: [0.8, 1],
            duration: 800,
            delay: 600,
            easing: 'easeOutElastic(1, .6)'
        });

        // Animación infinita de los círculos de fondo
        anime({
            targets: '.circle',
            translateX: () => anime.random(-100, 100),
            translateY: () => anime.random(-100, 100),
            duration: () => anime.random(3000, 7000),
            delay: () => anime.random(0, 1000),
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutSine'
        });
    </script>
</body>
</html>
